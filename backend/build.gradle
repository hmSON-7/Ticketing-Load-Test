plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ticket'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 모니터링: Actuator + Prometheus 지표 노출
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// API 문서화 & 로컬 테스트: Swagger UI (springdoc OpenAPI)
	// [보안 메모] 이행적 취약점 CVE-2025-48924 (CVSS 5.3):
	//   springdoc → swagger-core-jakarta:2.2.29 → commons-lang3:3.17.0 경로.
	//   commons-lang3 ClassUtils 무한 재귀로 StackOverflow(DoS) 가능, 3.18.0에서 수정됨.
	//   현재는 로컬 부하 테스트 도구 + 외부 입력이 취약 경로에 닿지 않아 위험 낮다고 판단, 미적용 상태.
	//   필요 시 아래 constraint로 강제 상향:
	//     constraints { implementation('org.apache.commons:commons-lang3:3.18.0') }
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
}

tasks.named('test') {
	useJUnitPlatform()
}
